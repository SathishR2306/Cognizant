server.port=8083
spring.application.name=spring-rest

logging.level.root=INFO
logging.level.com.cognizant=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/spring-rest.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics,beans,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Spring REST API
info.app.description=Cognizant Digital Nurture - Spring REST Assessment
info.app.version=1.0.0
info.app.author=Cognizant Trainee
